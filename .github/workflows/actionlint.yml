name: Lint GitHub Actions workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@264c6b750df669adb58286a26c5d0e04e839e06b # v2.0.8
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
